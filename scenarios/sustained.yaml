# Case 1: constant load, assert the p99 stays under budget.
name: sustained-baseline
profile:
  type: sustained
  concurrency: 20
  duration: 30s
  warmup: 5s          # warm-up samples are discarded from the reported stats
request:
  method: GET
  path: /
  # Optional: sent unchanged on every request — the only way to reach a
  # target that requires auth today, since Sapper has no login flow (FR-10).
  # headers:
  #   Authorization: Bearer ${LAB_TOKEN}
slos:
  p99_under: 200ms
  error_rate_under: 0.01
